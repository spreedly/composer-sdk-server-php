name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Packagist publishes a version as soon as its tag is pushed, so these checks
  # can only flag a bad release, not stop it. This job runs all dependency code
  # (Composer, tests) and can't write to the repository.
  build:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the main ancestry check can see main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, version and CHANGELOG.md
        id: check
        run: |
          NAME="$(jq -r .name composer.json)"
          VERSION="$(sed -n -E "s/^ *private const SDK_VERSION = '([^']+)';$/\1/p" src/Utilities.php)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match SDK_VERSION ${VERSION} in src/Utilities.php"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
          HEADING="$(grep -m1 -E "^## ${VERSION//./\\.}( |$)" CHANGELOG.md || true)"
          if [[ -z "${HEADING}" || "${HEADING,,}" == *unreleased* ]]; then
            echo "CHANGELOG.md needs a released '## ${VERSION}' section"
            exit 1
          fi
          awk -v v="${VERSION}" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test
        run: |
          composer test
          composer test-slow

      # The audit and SBOM read an install of composer.json without require-dev,
      # which is what users get. composer audit fails when there's nothing to
      # audit, so it only runs once there are runtime dependencies.
      - name: Audit runtime dependencies and write SBOM
        env:
          NAME: ${{ steps.check.outputs.name }}
          VERSION: ${{ steps.check.outputs.version }}
          COMPOSER_ROOT_VERSION: ${{ steps.check.outputs.version }}
          SYFT_VERSION: 1.55.0
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          RUNTIME="${RUNNER_TEMP}/runtime"
          mkdir "${RUNTIME}"
          jq 'del(."require-dev")' composer.json > "${RUNTIME}/composer.json"
          composer update --no-autoloader --no-interaction --no-progress --working-dir "${RUNTIME}"
          COUNT="$(jq '.packages | length' "${RUNTIME}/composer.lock")"
          if (( COUNT > 0 )); then
            composer audit --locked --working-dir "${RUNTIME}"
          else
            echo "No runtime dependencies to audit"
          fi
          ARCHIVE="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${ARCHIVE}"
          echo "${SYFT_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" syft
          ./syft scan "dir:${RUNTIME}" --override-default-catalogers php-composer-installed-cataloger --source-name "${NAME}" --source-version "${VERSION}" -o cyclonedx-json=sbom.cdx.json

      # Composer installs GitHub's zipball of the tagged commit. GitHub keeps the
      # files inside an archive of a commit the same, but may change how the zip
      # is compressed, so the release keeps a copy of the zip and checksums both
      # the zip and every file in it.
      - name: Download and checksum the release archive
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          ARCHIVE="${GITHUB_REPOSITORY#*/}-${VERSION}.zip"
          curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" -o "${ARCHIVE}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/${GITHUB_SHA}"
          sha256sum "${ARCHIVE}" > SHA256SUMS
          mkdir "${RUNNER_TEMP}/package"
          unzip -q "${ARCHIVE}" -d "${RUNNER_TEMP}/package"
          ROOT="$(find "${RUNNER_TEMP}/package" -mindepth 1 -maxdepth 1 -type d)"
          (cd "${ROOT}" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > FILES.SHA256SUMS
          echo "root=${ROOT}" >> "${GITHUB_OUTPUT}"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      # Scans the files users receive. The hash pins the download; --redact
      # keeps a found secret's value out of the public log while --verbose
      # still shows where it is.
      - name: Scan archive for secrets
        env:
          ROOT: ${{ steps.archive.outputs.root }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
          ./gitleaks dir "${ROOT}" --redact --verbose

      # Confirms the version Packagist serves is this commit. Packagist picks up
      # the tag through the repository's webhook, usually within a minute.
      - name: Check Packagist lists this commit
        env:
          NAME: ${{ steps.check.outputs.name }}
          VERSION: ${{ steps.check.outputs.version }}
          WAIT_SECONDS: 600
        run: |
          DEADLINE=$((SECONDS + WAIT_SECONDS))
          until REFERENCE="$(curl -sSf "https://repo.packagist.org/p2/${NAME}.json" | jq -r --arg name "${NAME}" --arg version "${VERSION}" '.packages[$name][]? | select((.version | ltrimstr("v")) == $version) | .dist.reference')" && [[ -n "${REFERENCE}" ]]; do
            if (( SECONDS >= DEADLINE )); then
              echo "Packagist doesn't list ${NAME} ${VERSION} after ${WAIT_SECONDS} seconds"
              exit 1
            fi
            sleep 30
          done
          if [[ "${REFERENCE}" != "${GITHUB_SHA}" ]]; then
            echo "Packagist serves ${NAME} ${VERSION} from ${REFERENCE}, not ${GITHUB_SHA}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ steps.archive.outputs.archive }}
            SHA256SUMS
            FILES.SHA256SUMS
            sbom.cdx.json
            release-notes.md

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md "./${ARCHIVE}" SHA256SUMS FILES.SHA256SUMS sbom.cdx.json
