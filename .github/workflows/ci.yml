name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirror the `php` floor in composer.json (>=8.2) through current stable.
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test
        run: composer test

      # phpunit.xml excludes the `slow` group, so the 30-second default-timeout
      # test runs only when asked for by name.
      - name: Test (slow group)
        run: composer test-slow
